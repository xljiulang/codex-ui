# codex-ui release 构建流水线
#
# 目的：把本机最耗时的「npm run build + cargo build --release」搬到 GitHub Actions，
# 本机只保留 Inno Setup 打包（见 build-installer.bat）。
#
# - push main（纯文档提交除外）→ 构建 codex-ui.exe 并作为 artifact 上传
# - push v* 标签 → 额外创建 GitHub Release 并附件 codex-ui.exe
# - 手动触发 → 同上（非标签运行只出 artifact）
#
# 本 workflow 不产出安装包，也不接触 setup\bin 下的 sidecar 二进制。

name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # 路径过滤只作用于分支推送（GitHub 不对标签推送求值路径过滤）
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支连续提交只保留最新一次构建；tag 发版不互相取消
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: 构建 codex-ui.exe
    runs-on: windows-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建 Rust release
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      # 守护：安装包只内置 setup/redist/x64 下的 VC 运行库 DLL（见 setup/setup.iss）。
      # exe 一旦新增 vcruntime/msvcp/concrt/vccorlib 依赖而未随包内置，装到没装过
      # VC++ 运行库的干净系统上会直接缺 DLL 起不来，这里提前拦下并提示补件。
      - name: 检查 VC 运行库依赖
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/codex-ui.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到产物：$exe" }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "未找到 vswhere.exe：$vswhere" }
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere 未定位到 Visual Studio 安装目录" }
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $vsPath "VC\Tools\MSVC") -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\Hostx64\x64\dumpbin.exe" } |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "未找到 dumpbin.exe（Visual Studio：$vsPath）" }

          $output = & $dumpbin.FullName /nologo /dependents $exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin 执行失败（exit $LASTEXITCODE）" }
          $imported = $output |
            Select-String -Pattern '^\s+(\S+\.dll)\s*$' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } |
            Sort-Object -Unique
          # api-ms-win-crt-*（UCRT）由 Windows 10/11 自带，不要求随包内置
          $required = @($imported | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib)' })
          $staged = @(Get-ChildItem -LiteralPath "setup/redist/x64" -Filter *.dll -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name)
          $missing = @($required | Where-Object { $staged -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "以下 VC 运行库未随包内置：$($missing -join ', ')。请把对应 DLL 放进 setup/redist/x64/ 并更新 setup/setup.iss 的 [Files]。"
          }
          Write-Host "VC 运行库依赖检查通过：$(if ($required.Count) { $required -join ', ' } else { '无' })"

      - name: 读取版本并写入构建信息
        id: meta
        shell: pwsh
        run: |
          $cargo = "src-tauri/Cargo.toml"
          $version = (Select-String -LiteralPath $cargo -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw "无法从 $cargo 解析版本号" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short_sha=$($env:GITHUB_SHA.Substring(0, 7))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          New-Item -ItemType Directory -Force -Path ci-output | Out-Null
          @(
            "version=$version"
            "commit=$env:GITHUB_SHA"
            "ref=$env:GITHUB_REF_NAME"
            "run=$env:GITHUB_RUN_NUMBER"
            "built-at=$([DateTime]::UtcNow.ToString('u'))"
          ) | Set-Content -LiteralPath ci-output/build-info.txt -Encoding utf8
          Get-Content -LiteralPath ci-output/build-info.txt

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/codex-ui.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到产物：$exe" }
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -lt 1MB) { throw "产物体积异常（$size 字节），前端可能未嵌入" }
          Write-Host "产物：$exe（$([math]::Round($size / 1MB, 1)) MB）"
          Copy-Item -LiteralPath $exe -Destination ci-output/codex-ui.exe -Force

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-ui-exe-${{ steps.meta.outputs.short_sha }}
          path: |
            ci-output/codex-ui.exe
            ci-output/build-info.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载 artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-ui-exe-${{ needs.build.outputs.short_sha }}

      - name: 校验 tag 与版本号一致
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::warning::标签 $GITHUB_REF_NAME 与 Cargo.toml 版本 $VERSION 不一致；安装包版本号取自 exe 自身，不中断发布"
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -l
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" codex-ui.exe build-info.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              codex-ui.exe \
              build-info.txt
          fi
