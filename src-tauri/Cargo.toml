[package]
name = "codex-ui"
version = "1.0.0"
description = "Codex CLI desktop UI wrapper"
authors = ["codex-ui"]
edition = "2021"

[lib]
name = "codex_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "time", "macros", "fs", "net"] }
rfd = "0.15"
open = "5"
clipboard-win = "5"
notify = "8"
portable-pty = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
] }
windows-core = "0.61"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = "0.15"
toml_edit = "0.22"
serde_yaml = "0.9"
tar = "0.4"
xz2 = "0.1"
flate2 = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
winreg = "0.55"
