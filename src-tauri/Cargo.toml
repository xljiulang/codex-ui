[package]
name = "codex-ui"
version = "0.1.0"
description = "Codex CLI desktop UI wrapper"
authors = ["codex-ui"]
edition = "2021"

[lib]
name = "codex_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# 远程 Web 模式：构建时内嵌前端 dist（npm run build 产物）
remote-web = []

[lints.rust]
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
axum = { version = "0.8", features = ["ws", "tokio", "query"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "time", "macros", "net"] }
rfd = "0.15"
open = "5"
clipboard-win = "5"
toml = "0.9"
notify = "8"
portable-pty = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
gix = { version = "0.86", features = [
    "tree-editor",
    "merge",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
