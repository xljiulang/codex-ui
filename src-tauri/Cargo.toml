[package]
name = "codex-ui"
version = "0.1.1"
description = "Codex CLI desktop UI wrapper"
authors = ["codex-ui"]
edition = "2021"

[lib]
name = "codex_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "time", "macros"] }
rfd = "0.15"
open = "5"
clipboard-win = "5"
notify = "8"
portable-pty = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml_edit = "0.22"
tar = "0.4"
xz2 = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
